[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simplecode"
version = "0.1.0"
description = "A terminal-first AI coding assistant foundation with streaming LLM providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.79,<1",
  "emoji>=2.14,<3",
  "httpx>=0.27,<1",
  "mcp>=1.12.4,<2",
  "openai>=2.15,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "textual>=3.0,<9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
simplecode = "simplecode.__main__:main"

[tool.setuptools.packages.find]
include = ["simplecode*"]

[tool.setuptools.package-data]
"simplecode.skills.builtins" = ["**/*.md", "**/*.json"]
"simplecode.agents.builtins" = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
